[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "verticalparts-omie-mcp"
version = "0.1.0"
description = "MCP vivo para o ERP Omie: acesso completo, catálogo dinâmico e detecção de mudanças na documentação oficial."
readme = "MCP_OMIE.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.10.0",
  "httpx>=0.28.1",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.9.0",
  "beautifulsoup4>=4.13.0",
]

[project.scripts]
omie-mcp = "omie_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omie_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
